<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucid-Truth-Audit Portal</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';">
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #111822;
      --border: #1e2a3a;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #00d4aa;
      --accent-dim: #00a88a;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }
    .logo { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
    .logo span { color: var(--accent); }
    .status { font-size: 0.8rem; color: var(--muted); }
    .status.ok { color: var(--accent); }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    h2 { font-size: 0.95rem; margin-bottom: 0.75rem; color: var(--accent); }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      margin-bottom: 0.85rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-dim);
    }
    textarea { min-height: 100px; resize: vertical; font-family: ui-monospace, monospace; }
    button {
      background: var(--accent);
      color: #04120e;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dim); }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.secondary:hover { border-color: var(--accent-dim); }
    .presets { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .preset {
      font-size: 0.75rem;
      padding: 0.35rem 0.7rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
    }
    .preset:hover { border-color: var(--accent); color: var(--accent); }
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.85rem;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: var(--accent); }
    .err { color: var(--danger); }
    .muted { color: var(--muted); font-size: 0.8rem; }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
  </style>
</head>
