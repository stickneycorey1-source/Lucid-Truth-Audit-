services:
  - type: web
    name: lucid-truth-audit
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: LTA_TENANTS_JSON
        sync: false
      - key: LTA_API_KEY
        sync: false
      - key: LTA_DEFAULT_PROVIDER
        value: "mock"
      - key: LTA_DEFAULT_TENANT
        value: "github-actions"
      - key: LTA_DEFAULT_POLICY
        value: "general_enterprise"
      - key: LTA_AUDIT_DB_URL
        value: "sqlite:////var/data/lta_audit_ledger.db"
      - key: LTA_CORS_ORIGINS
        value: ""
      - key: LTA_RATE_LIMIT_RPM
        value: "60"
    disk:
      name: lucid-audit-data
      mountPath: /var/data
      sizeGB: 1