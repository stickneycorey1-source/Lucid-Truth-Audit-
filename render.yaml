services:
  - type: web
    name: lucid-truth-audit
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: LUCID_TENANT_KEYS
        sync: false
      - key: LUCID_CORS_ORIGINS
        value: ""
      - key: LUCID_RATE_LIMIT_MAX
        value: "60"
      - key: LUCID_RATE_LIMIT_WINDOW_SEC
        value: "60"
      - key: LUCID_LEDGER_DB_PATH
        value: "/var/data/lucid_audit_ledger.db"
    disk:
      name: lucid-audit-data
      mountPath: /var/data
      sizeGB: 1
