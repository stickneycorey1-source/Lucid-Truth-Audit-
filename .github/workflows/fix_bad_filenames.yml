name: Fix Corrupted Filenames

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Remove corrupted filenames from Git index and verify checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Lucid Tech Repair Bot"
          git config --global user.email "actions@github.com"

          git clone --no-checkout --branch main --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo

          # Load HEAD into the Git index in memory (never writes illegal filenames to disk)
          git read-tree HEAD

          # Run git ls-files INSIDE Python (avoids Bash pipe + heredoc stdin collision)
          python3 - <<'PY'
          import subprocess

          raw_entries = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          to_remove = []
          for raw in raw_entries:
              if not raw:
                  continue
              path = raw.decode("utf-8", "replace")
              parts = path.split("/")
              too_long = any(len(part.encode("utf-8")) > 200 for part in parts)
              has_newline = ("\n" in path or "\r" in path)
              if (
                  has_newline
                  or too_long
                  or "diff --git" in path
                  or path.startswith("Commercial & Trademark Notice")
              ):
                  print(f"REMOVING ({len(raw)} bytes): {path[:90]!r}")
                  to_remove.append(raw)

          if to_remove:
              payload = b"\0".join(to_remove) + b"\0"
              subprocess.run(
                  ["git", "update-index", "--force-remove", "-z", "--stdin"],
                  input=payload,
                  check=True,
              )
              print(f"Successfully removed {len(to_remove)} corrupted path(s).")
          else:
              print("No corrupted paths matched.")
          PY

          OLD_TREE=$(git rev-parse HEAD^{tree})
          NEW_TREE=$(git write-tree)
          if [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "ERROR: Tree unchanged — listing all paths in index for inspection:"
            git ls-files
            exit 1
          fi

          NEW_COMMIT=$(git commit-tree "$NEW_TREE" -p HEAD -m "Fix: strip corrupted diff filename from Git index")
          git update-ref refs/heads/main "$NEW_COMMIT"

          # Verify Linux checkout succeeds 100% BEFORE pushing to GitHub
          git checkout -f main
          echo "CHECKOUT VERIFIED CLEAN! Pushing to origin/main..."
          git push origin main
