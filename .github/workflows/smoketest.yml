name: Live Render Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL"
        required: false
        default: "https://lucid-truth-audit.onrender.com"
        type: string
      timeout_seconds:
        description: "HTTP request timeout in seconds"
        required: false
        default: "15"
        type: string

permissions:
  contents: read

jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests

      - name: Run Live Smoke Test
        env:
          LTA_BASE_URL: ${{ inputs.base_url }}
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
          LTA_SHADOW_KEY: ${{ secrets.LTA_SHADOW_KEY }}
          LTA_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          LTA_REPORT_PATH: lta_smoketest_report.html
        run: python scripts/run_smoketest.py

      - name: Upload HTML Report (Unzipped)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-truth-audit-smoketest-report
          path: lta_smoketest_report.html
          archive: false
          retention-days: 14