name: Lucid-Truth-Audit Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete test suite with coverage
        env:
          PYTHONPATH: "."
        run: mkdir -p reports
          python -m pytest -o addopts="" -v \
            --cov=app --cov=lta \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage \
            --cov-fail-under=60 \
            --html=reports/compliance_audit.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/audit_ledger.json

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucid-truth-audit-${{ matrix.python-version }}-validation
          path: reports/

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  container-validation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          trap 'rm -f .env' EXIT
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env
          docker compose -f docker-compose.yml config --quiet

      - name: Build application image
        run: docker build --tag lucid-truth-audit:ci .

      - name: Start application and verify health
        run: |
          trap 'rm -f .env' EXIT
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env

          docker run --detach --name lta-validation \
            --publish 10080:10000 \
            --env LUCID_TENANT_KEYS="" \
            lucid-truth-audit:ci

          trap 'docker rm -f lta-validation >/dev/null 2>&1 || true; rm -f .env' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:10080/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs lta-validation
          exit 1