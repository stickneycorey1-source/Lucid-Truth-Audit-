name: Lucid Truth Audit CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  LUCID_AUDIT_API_KEY: ${{ secrets.LUCID_AUDIT_API_KEY || 'test-only-secret' }}

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Lucid-Truth-Audit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Red Team & Pydantic Guardrail Suite
        run: |
          pytest test_audit.py test_vector2_pii.py -v --html=compliance_audit.html --self-contained-html

      - name: Upload Compliance Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-truth-compliance-report
          path: compliance_audit.html
          retention-days: 30
