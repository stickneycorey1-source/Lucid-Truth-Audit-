name: Lucid-Truth-Audit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements.txt pytest pytest-cov pytest-html pytest-json-report requests pip-audit

      - name: Run Dependency Audit (pip_audit)
        run: python -m pip_audit

      - name: Run Offline Unit & Coverage Suite
        run: |
          mkdir -p reports
          python -m pytest -o addopts="" -v \
            --ignore=test_lta_gaps.py \
            --cov=app --cov=lta \
            --cov-report=term-missing \
            --cov-report=html:reports/coverage \
            --cov-fail-under=60 \
            --html=reports/compliance_audit.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/audit_ledger.json

      - name: Run Live Endpoint Gap Tests
        if: env.LTA_API_KEY != ''
        env:
          LTA_BASE_URL: https://lucid-truth-audit.onrender.com
          LTA_API_KEY: ${{ secrets.LTA_API_KEY }}
          LTA_SHADOW_KEY: ${{ secrets.LTA_SHADOW_KEY }}
        run: python -m pytest -o addopts="" -v test_lta_gaps.py

      - name: Upload Validation & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-truth-audit-3.11-validation
          path: reports/
          retention-days: 14