name: AI Red Team Audit Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install pydantic pytest fastapi uvicorn httpx
    - run: pytest -v
    - run: python3 audit_scorer.py
