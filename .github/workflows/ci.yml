name: Lucid-Truth-Audit v2.0.1 Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Production Guardrail Suite
        env:
          PYTHONPATH: "."
          LUCID_TENANT_KEYS: "p2_pilot:p2-ci-secret-2026:2099-12-31,expired_demo:old-key-2020:2020-01-01"
        run: |
          python -m pytest -v --html=compliance_audit.html --self-contained-html --json-report --json-report-file=audit_ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-truth-audit-v2-0-1-compliance-artifacts
          path: |
            compliance_audit.html
            audit_ledger.json
