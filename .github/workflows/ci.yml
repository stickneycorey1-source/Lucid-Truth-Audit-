name: Lucid-Truth-Audit Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime & Test Reporting Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.2.0 pytest-html==4.2.0 pytest-json-report==1.5.0 httpx==0.28.1

      - name: Run Production Guardrail Suite
        env:
          PYTHONPATH: "."
        run: |
          mkdir -p reports
          python -m pytest -o addopts="" -v \
            --ignore=tests/test_enterprise_gateway.py \
            --html=reports/compliance_audit.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/audit_ledger.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lucid-truth-audit-v2-0-2-compliance-artifacts
          path: |
            reports/compliance_audit.html
            reports/audit_ledger.json