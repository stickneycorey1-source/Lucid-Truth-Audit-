name: Lucid Truth Audit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lucid-Truth-Audit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Red Team & Pydantic Guardrail Suite
        run: |
          mkdir -p reports
          pytest -v \
            --html=reports/compliance_audit.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/compliance_audit.json

      - name: Upload Compliance Audit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-audit-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
