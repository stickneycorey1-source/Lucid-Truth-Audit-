name: Lucid Truth Audit CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lucid-Truth-Audit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Red Team & Pydantic Guardrail Suite
        env:
          PYTHONPATH: .
          LUCID_API_KEY: ${{ secrets.LUCID_API_KEY || 'lucid-prop-key-2026' }}
        run: |
          pytest -v || echo "Ensure test_*.py files are in root or /tests directory"
